<article class="news-card">
  <img
    class="news-card__photo"
    [src]="article().imagen"
    alt=""
    loading="lazy"
    width="411"
    height="220"
  />
  <div class="news-card__body">
    <div class="news-card__meta">
      <span class="news-card__category">{{ article().categoria }}</span>
      <app-favorite-button [id]="article().id" [title]="article().titulo" />
    </div>
    <h3>{{ article().titulo }}</h3>
    <time [attr.datetime]="article().fecha">{{ article().fecha | date: 'dd MMM yyyy' }}</time>
    <p>{{ article().descripcion }}</p>
    <a
      class="news-card__link"
      [routerLink]="['/noticias', article().id]"
      queryParamsHandling="preserve"
      [attr.aria-label]="'Ver más: ' + article().titulo"
      >Ver más →</a
    >
  </div>
</article>
