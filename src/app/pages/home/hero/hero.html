<section class="hero">
  <div class="hero__content">
    <div class="hero__text">
      <h1 class="hero__title">La actualidad que te conecta</h1>
      <p class="hero__description">
        Descubre noticias relevantes de tecnología, educación, turismo, innovación y mucho más. Todo
        en un solo lugar.
      </p>
    </div>
    <a class="hero__cta" routerLink="/noticias">Explorar noticias →</a>
  </div>
  @if (featured(); as article) {
    <div class="hero__featured">
      <img appNewsImage class="hero__image" [src]="article.imagen" alt="" />
      <article class="hero__card">
        <span class="hero__card-label">Destacado del Día</span>
        <h2 class="hero__card-title">{{ article.titulo }}</h2>
        <p class="hero__card-description">{{ article.descripcion }}</p>
        <a class="hero__card-link" [routerLink]="['/noticias', article.id]"
          >Leer artículo completo →</a
        >
      </article>
    </div>
  }
</section>
