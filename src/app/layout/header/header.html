<header class="header">
  <div class="header__brand">
    <img src="images/logo.svg" alt="Logo de NEXT Noticias" class="header__logo" />
    <span class="header__title">NEXT Noticias</span>
  </div>

  <button
    type="button"
    class="header__menu-toggle"
    [attr.aria-expanded]="isMenuOpen"
    aria-label="Abrir menú de navegación"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="header__nav" [class.header__nav--open]="isMenuOpen">
    @for (link of navLinks; track link.label) {
      <a
        class="header__nav-link"
        [class.header__nav-link--active]="link.isActive"
        href="#"
        (click)="$event.preventDefault(); onNavLinkClick(link)"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="header__actions">
    <button type="button" class="header__icon-button" aria-label="Buscar" (click)="onSearchClick()">
      <img src="images/search-trigger.svg" alt="" class="header__icon" />
    </button>
    <button type="button" class="header__login" (click)="onLoginClick()">Iniciar sesión</button>
  </div>
</header>
