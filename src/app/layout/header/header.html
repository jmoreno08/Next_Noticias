<header class="header">
  <div class="header__brand">
    <button
      type="button"
      class="header__menu-toggle"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Abrir menú de navegación"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a
      class="header__brand-link"
      routerLink="/"
      aria-label="Ir al inicio de NEXT Noticias"
      (click)="onNavLinkClick()"
    >
      <img src="icons/logo.svg" alt="Logo de NEXT Noticias" class="header__logo" />
      <span class="header__title">NEXT Noticias</span>
    </a>
  </div>

  <nav class="header__nav" [class.header__nav--open]="isMenuOpen">
    @for (link of navLinks(); track link.label) {
      @if (link.path) {
        <a
          class="header__nav-link"
          [routerLink]="link.path"
          routerLinkActive="header__nav-link--active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          ariaCurrentWhenActive="page"
          (click)="onNavLinkClick()"
        >
          {{ link.label }}
        </a>
      } @else {
        <span
          class="header__nav-link header__nav-link--pending"
          aria-disabled="true"
          title="Disponible próximamente"
          >{{ link.label }}</span
        >
      }
    }
  </nav>

  <div class="header__actions">
    <button type="button" class="header__icon-button" aria-label="Buscar" (click)="onSearchClick()">
      <img src="icons/search-trigger.svg" alt="" class="header__icon" />
    </button>
    <button type="button" class="header__login" (click)="onLoginClick()">
      {{ auth.isAdmin() ? 'Cerrar sesión' : 'Iniciar sesión' }}
    </button>
  </div>
</header>
